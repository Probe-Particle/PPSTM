title = "Default configuration"


[scan]
scan_type       = 'states'
tip_type        = 'fixed'
scan_window     = [[-5, -5, -5], [5, 5, 5]]
scan_dim        = [50, 50, 50]
V               = -0.1 # s orb and py are inside - sellected by cut_min and cut_max and fermi
V_max           = +0.1
dV              =  0.1
eta             =  0.0000001
tip_orb         = 's'
sample_orbs     = 'spd'

[input]
path            = './'
dft_code        = 'fireball'
geometry_file   = 'input_plot.xyz'
pbc             = [0, 0]
lvs             = false
spin            = false
cp2k_name       = 'None'
Q               = 0.0
K               = 0.24
data_format     = 'npy'

[advanced]
cut_atoms       = -1
lower_atoms     = []
lower_coefs     = []
work_function   = -7.5
work_function_decay =  1000.0 # py orb has WF of -12.5; s has WF -2.5 eV
fermi           = -0.035 # - exactly in the middle
cut_min         = -0.01 # -0.04 -s orb and -0.03 py are inside
cut_max         = +0.01

[output]
plot_atoms      = true
PNG             = false
WSxM            = false
NPY             = false
XSF             = true
